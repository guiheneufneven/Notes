<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz S01 – Admin Windows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#18202E; --muted:#5A6478; --line:#D8DEE8;
  --ok:#1B8A4B; --ok-bg:#E7F5EC; --ko:#C0362C; --ko-bg:#FBEBE9;
  --accent:#2457C5;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121722; --surface:#1A2130; --ink:#E6EAF2; --muted:#97A1B5; --line:#2C3547;
    --ok:#4CC47F; --ok-bg:#16301F; --ko:#F0675C; --ko-bg:#3A1D1B;
    --accent:#6F9BFF;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 32px}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
h1::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--accent);margin-bottom:14px}
h2{font-size:1.2rem;margin:0 0 12px;font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)}
code{font-family:var(--mono);font-size:.88em;background:color-mix(in srgb,var(--accent) 10%,transparent);padding:.08em .35em;border-radius:4px;word-break:break-word}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.intro{margin-bottom:22px}
.block{margin-bottom:20px}
.label{font-weight:600;font-size:.95rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.label small{font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip input:disabled{cursor:not-allowed}
.chip span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.9rem;color:var(--muted)}
.chip input:checked + span{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.chip input:disabled + span{opacity:.4}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:.85rem;text-decoration:underline;text-underline-offset:2px}

.primary{background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:12px 20px;font-weight:600}
.secondary{background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 18px;font-weight:500}
.primary:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.best{font-size:.9rem;color:var(--muted);margin-left:auto}

/* Piste de progression : un segment par question */
.track{display:flex;gap:3px;margin:10px 0 18px;height:8px}
.track i{flex:1;border-radius:2px;background:var(--line);transition:background .25s}
.track i.cur{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.track i.ok{background:var(--ok)}
.track i.ko{background:var(--ko)}
.track.dense{gap:1px}
@media (max-width:480px){.track{gap:2px;height:6px}}

.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.9rem;color:var(--muted)}
.qhead b{color:var(--ink);font-weight:600}
.theme{font-size:.8rem;color:var(--accent);font-weight:600}
.question{font-size:1.15rem;font-weight:600;line-height:1.45;margin:4px 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font:500 .8rem var(--mono);border:1px solid var(--line);color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ko);background:var(--ko-bg)}
.opt.wrong .k{background:var(--ko);border-color:var(--ko);color:var(--surface)}
.opt.dim{opacity:.55}

.feedback{margin-top:14px;padding:14px 16px;border-radius:10px;border-left:4px solid var(--ok);background:var(--surface)}
.feedback.ko{border-left-color:var(--ko)}
.feedback .verdict{font-weight:700;margin-bottom:4px}
.feedback.ok .verdict{color:var(--ok)}
.feedback.ko .verdict{color:var(--ko)}
.feedback .src{font-size:.82rem;color:var(--muted);margin-top:8px}
.next{margin-top:16px}

.score{display:flex;align-items:baseline;gap:14px;margin:6px 0 4px}
.score strong{font-size:3rem;line-height:1;font-weight:700;letter-spacing:-.02em}
.score span{color:var(--muted)}
.rows{border-top:1px solid var(--line);margin:18px 0}
.row{display:grid;grid-template-columns:1fr 110px 52px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.row .n{text-align:right;font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.misses{margin-top:10px}
.miss{padding:12px 0;border-bottom:1px solid var(--line)}
.miss p{margin:0 0 4px}
.miss .a{color:var(--ok);font-size:.93rem}
.miss .y{color:var(--ko);font-size:.93rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">

  <section id="start">
    <div class="intro">
      <h1>S01 – Admin Windows</h1>
      <p class="muted" id="introTxt"></p>
    </div>

    <div class="block">
      <div class="label"><span>Thèmes</span><button class="linkbtn" id="toggleAll">Tout décocher</button></div>
      <div class="chips" id="themes"></div>
    </div>

    <div class="block">
      <div class="label"><span>Nombre de questions</span><small id="avail"></small></div>
      <div class="chips" id="counts"></div>
    </div>

    <div class="actions">
      <button class="primary" id="go">Commencer</button>
      <span class="best" id="best"></span>
    </div>
  </section>

  <section id="quiz" hidden>
    <div class="qhead"><span>S01 – Admin Windows</span><span><b id="qnum"></b> / <span id="qtot"></span></span></div>
    <div class="track" id="track" aria-hidden="true"></div>
    <div class="theme" id="qtheme"></div>
    <div class="question" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div id="fb" hidden></div>
    <div class="actions next">
      <button class="primary" id="nextBtn" hidden>Question suivante</button>
      <button class="linkbtn" id="quit">Arrêter</button>
    </div>
  </section>

  <section id="result" hidden>
    <div class="qhead"><span>S01 – Admin Windows</span></div>
    <div class="score"><strong id="rscore"></strong><span id="rpct"></span></div>
    <div class="track" id="rtrack" aria-hidden="true"></div>
    <div class="rows" id="rows"></div>
    <div class="actions">
      <button class="primary" id="retryMiss">Revoir mes erreurs</button>
      <button class="secondary" id="again">Nouveau quiz</button>
    </div>
    <div class="misses" id="misses"></div>
  </section>

</main>

<script>
/* Banque de questions : o[0] = bonne réponse (mélangée à l'affichage), `texte` = code */
const STORE_KEY = "asrquiz-best-windows";
const QUESTIONS = [
/* ---------- Contextes et Windows Server ---------- */
{t:"Windows Server",q:"Dans un contexte d'hébergement traditionnel (on-premises), où sont stockées les ressources ?",o:["Sur des serveurs internes, dans le réseau privé de l'entreprise","Dans les datacenters d'un prestataire tiers","Uniquement sur les postes clients","Chez l'éditeur du logiciel"],e:"Les utilisateurs nomades y accèdent en VPN. La disponibilité est assurée par l'équipe interne ou un prestataire.",s:"Cours · Contextes de travail"},
{t:"Windows Server",q:"Quelle contrainte s'impose aux clients dans un contexte 100 % cloud ?",o:["Disposer obligatoirement d'un accès à Internet","Installer un client VPN","Être joints à un domaine AD local","Utiliser Windows Server Datacenter"],e:"Les services sont hébergés chez un prestataire : sans Internet, plus d'accès aux outils du quotidien.",s:"Cours · Contextes de travail"},
{t:"Windows Server",q:"Comment définir le mode hybride ?",o:["Une partie des services est on-premises, une autre dans le cloud","Un serveur à la fois physique et virtuel","Un domaine AD avec deux forêts","Un poste en double boot"],e:"Exemple : authentification et fichiers en interne, messagerie et services web dans le cloud.",s:"Cours · Contextes de travail"},
{t:"Windows Server",q:"Quelle édition de Windows Server 2022 permet un nombre illimité de VM Windows Server ?",o:["Datacenter","Standard","Essentials","Toutes les éditions"],e:"Standard : 2 VM par licence. Essentials : 1 seule VM, 25 utilisateurs ou 50 périphériques max.",s:"Cours · Éditions Windows Server"},
{t:"Windows Server",q:"Combien de cœurs couvre une licence Windows Server Standard ou Datacenter ?",o:["16 cœurs","4 cœurs","8 cœurs","Nombre illimité"],e:"Ces deux éditions nécessitent en plus des licences d'accès client (CAL).",s:"Cours · Éditions Windows Server"},
{t:"Windows Server",q:"Quel est le mode d'installation sélectionné par défaut pour Windows Server ?",o:["Server Core (installation minimale)","Expérience de bureau","Nano Server","Mode graphique allégé"],e:"Core : moins de RAM et de disque, surface d'attaque réduite, administration à distance.",s:"Cours · Modes d'installation"},
{t:"Windows Server",q:"Quelle affirmation sur le choix du mode d'installation est vraie selon le cours ?",o:["Il n'y a pas de retour arrière une fois le serveur installé","On peut basculer de Core à graphique en un clic","Le mode Core est réservé aux contrôleurs de domaine","Le mode graphique consomme moins de ressources"],e:"D'où la pratique courante : un ou deux serveurs avec interface graphique, les autres en Core.",s:"Cours · Modes d'installation"},
{t:"Windows Server",q:"Pourquoi le mode Core réduit-il la surface d'attaque ?",o:["Moins de services en fonctionnement, donc moins de failles potentielles","Il chiffre tout le disque","Il bloque tout le trafic réseau","Il n'a pas de compte administrateur"],e:"Il réduit aussi l'empreinte en RAM et en disque.",s:"Cours · Modes d'installation"},
{t:"Windows Server",q:"Quels paramètres faut-il vérifier avant de promouvoir un serveur en contrôleur de domaine ?",o:["Le nom du poste et une adresse IP statique correcte","Le fond d'écran et la langue","L'installation d'Office","L'activation du Wi-Fi"],e:"Ensuite seulement on ajoute le rôle AD DS : `Install-WindowsFeature AD-Domain-Services -IncludeManagementTools`.",s:"Cours · Prérequis de promotion"},

/* ---------- Outils et supervision ---------- */
{t:"Outils et supervision",q:"Quelle console est présentée comme LA console centrale d'administration d'un serveur ?",o:["Le Gestionnaire de serveur","L'Observateur d'événements","Le Panneau de configuration","Le Gestionnaire de périphériques"],e:"Autres outils : PowerShell, cmd, les consoles MMC (localement ou à distance via les RSAT) et Windows Admin Center.",s:"Cours · Outils de gestion"},
{t:"Outils et supervision",q:"Qu'est-ce que Windows Admin Center ?",o:["Une console de gestion web en HTTPS, déployée par un package MSI","Un composant MMC natif de Windows Server 2008","Le nouveau nom du Gestionnaire des tâches","Un service cloud obligatoire pour AD"],e:"Apparu en 2018, il gère les serveurs ≥ 2016 et intègre des outils Azure.",s:"Cours · Windows Admin Center"},
{t:"Outils et supervision",q:"Quel raccourci ouvre directement le Gestionnaire des tâches ?",o:["Ctrl+Maj+Échap","Ctrl+Alt+Inser","Win+R puis `taskmgr.msc`","Alt+F4"],e:"Il donne un suivi immédiat : processus, CPU, mémoire, disque, réseau, utilisateurs et services.",s:"Cours · Outils temps réel"},
{t:"Outils et supervision",q:"Quelle commande lance le Moniteur de ressources ?",o:["`resmon`","`perfmon`","`eventvwr`","`msinfo32`"],e:"Plus détaillé que le Gestionnaire des tâches, avec un détail par processus pour chaque composant.",s:"Cours · Outils temps réel"},
{t:"Outils et supervision",q:"Quel outil sert à collecter des données de performances, les analyser et créer des rapports ?",o:["L'Analyseur de performances (`perfmon`)","Le Gestionnaire des tâches","L'Observateur d'événements","Le Gestionnaire de serveur"],e:"C'est l'outil d'analyse, là où Gestionnaire des tâches et Moniteur de ressources sont des outils temps réel.",s:"Cours · Outil d'analyse"},
{t:"Outils et supervision",q:"Dans l'Observateur d'événements, quel journal contient les événements liés à l'audit ?",o:["Sécurité","Système","Application","Installation"],e:"Application : événements des applications. Système : événements de l'OS. Certains rôles ont aussi des journaux dédiés.",s:"Cours · Observateur d'événements"},
{t:"Outils et supervision",q:"Quelle fonctionnalité de l'Observateur d'événements permet de collecter les événements d'autres serveurs ?",o:["Les abonnements","Les vues personnalisées","Les tâches planifiées","Les filtres WMI"],e:"On peut aussi créer des vues personnalisées et déclencher une action à la survenue d'un événement.",s:"Cours · Observateur d'événements"},

/* ---------- Concepts AD DS ---------- */
{t:"Concepts AD DS",q:"Dans un groupe de travail (workgroup), comment chaque poste authentifie-t-il les utilisateurs ?",o:["Avec sa propre base de comptes locale (SAM)","Auprès d'un contrôleur de domaine","Par le catalogue global","Par Kerberos auprès du serveur DNS"],e:"Pas de login unique, mots de passe et permissions difficiles à gérer : adapté aux très petits environnements.",s:"Cours · Workgroup vs domaine"},
{t:"Concepts AD DS",q:"Que font les machines membres d'un domaine AD pour l'authentification ?",o:["Elles délèguent l'authentification au contrôleur de domaine","Elles répliquent la base SAM entre elles","Elles utilisent chacune leur base locale","Elles s'authentifient auprès du serveur DHCP"],e:"Un même utilisateur peut ainsi se connecter à n'importe quelle machine du domaine, avec un mot de passe géré à un seul endroit.",s:"Cours · Workgroup vs domaine"},
{t:"Concepts AD DS",q:"Quel ordre d'imbrication de la structure logique d'AD est correct ?",o:["Forêt → arbres → domaines → unités d'organisation → objets","Domaine → forêt → arbre → OU","OU → domaine → forêt → arbre","Arbre → OU → domaine → forêt"],e:"Une forêt contient 1 à n arbres, un arbre 1 à n domaines, un domaine n OU, une OU n objets.",s:"Cours · Structures d'AD"},
{t:"Concepts AD DS",q:"Qu'est-ce qu'une forêt Active Directory ?",o:["Un ensemble de domaines partageant un schéma et un catalogue global communs","Un domaine unique avec plusieurs OU","Un ensemble de sites géographiques","Un groupe de contrôleurs en lecture seule"],e:"Les domaines d'une forêt n'ont pas forcément le même nom commun. Les approbations y sont bidirectionnelles par défaut.",s:"Cours · Arbre et forêt"},
{t:"Concepts AD DS",q:"Comment ajoute-t-on un domaine dans un arbre existant ?",o:["En le désignant comme enfant d'un domaine déjà configuré","En le liant à une OU","En créant un nouveau site","En modifiant le schéma"],e:"Le nommage suit le DNS (ex. `paris.ma-societe.local` sous `ma-societe.local`).",s:"Cours · Arbre et forêt"},
{t:"Concepts AD DS",q:"Une unité d'organisation (OU) correspond-elle à un emplacement physique ?",o:["Non, c'est un conteneur logique pour organiser et gérer les objets","Oui, une OU par bâtiment","Oui, une OU par sous-réseau IP","Oui, elle correspond à un site AD"],e:"Les OU servent à organiser les objets, appliquer des GPO ciblées et déléguer l'administration. La topologie physique, ce sont les sites.",s:"Cours · Unité d'organisation"},
{t:"Concepts AD DS",q:"Quels sont les trois rôles d'une OU cités dans le cours ?",o:["Organiser les objets, appliquer des GPO ciblées, déléguer l'administration","Répliquer, authentifier, chiffrer","Stocker les mots de passe, les GPO et les zones DNS","Définir les sites, les liens et les sous-réseaux"],e:"Tout objet de l'annuaire ne peut se trouver que dans un seul conteneur.",s:"Cours · Les Unités d'Organisation"},
{t:"Concepts AD DS",q:"Sur combien de partitions logiques principales sont réparties les données AD ?",o:["Trois : domaine, configuration, schéma","Deux : utilisateurs et ordinateurs","Une seule base NTDS","Cinq, une par rôle FSMO"],e:"Domaine = objets du domaine. Schéma = classes et attributs. Configuration = sites, services. S'y ajoutent les partitions applicatives (zones DNS).",s:"Cours · Structure logique de la base AD"},
{t:"Concepts AD DS",q:"Que contient la partition Schéma ?",o:["Les classes d'objets et leurs attributs","Les comptes utilisateurs","La configuration des sites AD","Les zones DNS intégrées"],e:"Seul le maître de schéma peut y écrire. Les modifications sont répliquées à toute la forêt.",s:"Cours · Structure logique de la base AD"},
{t:"Concepts AD DS",q:"Quel est le chemin par défaut de la base de données Active Directory ?",o:["`C:\\Windows\\NTDS`","`C:\\Windows\\SYSVOL`","`C:\\Windows\\System32\\config`","`C:\\ProgramData\\AD`"],e:"Les fichiers (GPO, scripts) sont dans le partage SYSVOL : `C:\\Windows\\SYSVOL`.",s:"Cours · Contrôleurs de domaine"},
{t:"Concepts AD DS",q:"Quels protocoles et services l'environnement AD nécessite-t-il notamment ?",o:["TCP/IP, DNS, LDAP, Kerberos","FTP, SMTP, POP3","HTTP uniquement","SNMP et Syslog"],e:"Le cours cite TCP/IP, DHCP, DNS, SNTP, LDAP/LDIF, Kerberos/X509 et NTFS.",s:"Cours · L'environnement AD"},

/* ---------- Contrôleurs et FSMO ---------- */
{t:"Contrôleurs et FSMO",q:"Que signifie le fonctionnement « multi-maître » des contrôleurs de domaine ?",o:["Tous les DC peuvent modifier l'annuaire, les changements sont répliqués","Un seul DC est accessible en écriture","Chaque DC a sa propre base indépendante","Les DC se partagent la charge DNS"],e:"Seules les opérations FSMO restent confiées à un contrôleur unique.",s:"Cours · Contrôleurs de domaine"},
{t:"Contrôleurs et FSMO",q:"Quelle est la particularité de la réplication d'un RODC ?",o:["Elle est unidirectionnelle, uniquement vers le RODC","Elle est bidirectionnelle comme un DC classique","Il ne réplique rien","Il réplique uniquement le schéma"],e:"Le RODC sert quand la sécurité physique est insuffisante ou les besoins d'authentification réduits (agence).",s:"Cours · RODC"},
{t:"Contrôleurs et FSMO",q:"Quel mécanisme contrôle quels mots de passe un RODC peut stocker ?",o:["La stratégie de réplication des mots de passe","La PSO","Le filtrage WMI","Le catalogue global"],e:"Elle définit les comptes dont le mot de passe peut être mis en cache et ceux qui sont interdits.",s:"Cours · RODC"},
{t:"Contrôleurs et FSMO",q:"Combien y a-t-il de rôles FSMO ?",o:["5","3","7","2"],e:"2 à l'échelle de la forêt (attribution des noms de domaine, schéma), 3 à l'échelle du domaine (émulateur PDC, RID, infrastructure).",s:"Cours · Rôles FSMO"},
{t:"Contrôleurs et FSMO",q:"Quels rôles FSMO sont uniques à l'échelle de la forêt ?",o:["Maître de schéma et maître d'attribution des noms de domaine","Émulateur PDC et maître RID","Maître RID et maître d'infrastructure","Catalogue global et émulateur PDC"],e:"Les trois autres (PDC, RID, infrastructure) sont uniques par domaine.",s:"Cours · Rôles FSMO"},
{t:"Contrôleurs et FSMO",q:"Quel rôle FSMO est la source de temps des contrôleurs du domaine ?",o:["L'émulateur PDC","Le maître RID","Le maître d'infrastructure","Le maître de schéma"],e:"Il reçoit aussi en priorité les changements de mot de passe et effectue les modifications de GPO du domaine.",s:"Cours · Rôles FSMO"},
{t:"Contrôleurs et FSMO",q:"Quel rôle FSMO attribue des plages d'identifiants relatifs aux contrôleurs ?",o:["Le maître RID","L'émulateur PDC","Le maître d'infrastructure","Le maître d'attribution des noms"],e:"Le RID compose en partie le SID de chaque objet de sécurité.",s:"Cours · Rôles FSMO"},
{t:"Contrôleurs et FSMO",q:"Quel rôle maintient à jour les références d'objets entre domaines ?",o:["Le maître d'infrastructure","Le maître RID","Le maître de schéma","L'émulateur PDC"],e:"Il n'a d'utilité que dans un contexte multi-domaine.",s:"Cours · Rôles FSMO"},
{t:"Contrôleurs et FSMO",q:"Quand est contacté le maître d'attribution des noms de domaine ?",o:["Lors de l'ajout, la suppression ou le renommage d'un domaine dans la forêt","À chaque ouverture de session","À chaque changement de mot de passe","Lors de la création d'une OU"],e:"Aussi lors de l'ajout ou de la suppression de partitions d'applications.",s:"Cours · Rôles FSMO"},
{t:"Contrôleurs et FSMO",q:"Qui héberge les 5 rôles FSMO à la création d'une forêt ?",o:["Le premier contrôleur du domaine racine de la forêt","Chaque contrôleur en héberge un","Le serveur DNS","Le dernier contrôleur promu"],e:"Le premier DC d'un nouveau domaine enfant reçoit les 3 rôles de domaine.",s:"Cours · Rôles FSMO"},
{t:"Contrôleurs et FSMO",q:"Quelle commande affiche les rôles FSMO de domaine ?",o:["`Get-ADDomain | select pdc*,*master`","`Get-ADUser -FSMO`","`netstat -fsmo`","`Get-ADGroup -Role`"],e:"Pour la forêt : `Get-ADForest | select *master`.",s:"Cours · Transfert et récupération"},
{t:"Contrôleurs et FSMO",q:"Quelle est la différence entre transférer et récupérer (saisir) un rôle FSMO ?",o:["Le transfert exige que le DC d'origine soit joignable, la récupération non","La récupération est plus rapide mais identique","Le transfert ne se fait qu'en graphique","Aucune différence"],e:"Après une récupération, l'ancien détenteur ne doit plus jamais être remis en ligne.",s:"Cours · Transfert et récupération"},
{t:"Contrôleurs et FSMO",q:"Pourquoi la console Schéma Active Directory n'est-elle pas activée par défaut ?",o:["Une erreur de manipulation peut endommager irrémédiablement l'annuaire","Elle est payante","Elle ne fonctionne qu'en Server Core","Elle a été supprimée"],e:"Mesure de sécurité : les modifications du schéma sont répliquées à toute la forêt.",s:"Cours · Transfert et récupération"},
{t:"Contrôleurs et FSMO",q:"Quel est le rôle d'un serveur de catalogue global ?",o:["Permettre de trouver un objet dans toute la forêt et fournir les appartenances aux groupes à l'ouverture de session","Stocker les GPO","Distribuer l'heure","Répliquer le DNS"],e:"Il contient tous les objets de la forêt, mais seulement un sous-ensemble de leurs attributs.",s:"Cours · Catalogue global"},

{t:"Promotion d'un DC",q:"Pourquoi créerait-on un nouveau domaine dans une forêt existante ?",o:["Pour une nouvelle entité administrative avec ses propres objets et administrateurs","Pour accroître la disponibilité","Pour isoler totalement le domaine","Pour ajouter un catalogue global"],e:"Pour isoler complètement un domaine, on crée une nouvelle forêt.",s:"Cours · Scénarios de promotion"},

{t:"Sites et réplication",q:"Quels éléments participent à la configuration des sites AD ?",o:["Sites, liens de sites, sous-réseaux et contrôleurs de domaine","OU, groupes et GPO","Zones DNS et étendues DHCP","Partages et imprimantes"],e:"Chaque sous-réseau IP est associé à un site.",s:"Cours · Configuration des sites"},

/* ---------- NTFS et partages ---------- */
{t:"NTFS et partages",q:"Un utilisateur a « Lecture » via un groupe et « Modification » via un autre. Résultat en NTFS ?",o:["Modification : les autorisations se cumulent","Lecture : la plus restrictive gagne","Aucun accès","Contrôle total"],e:"En NTFS, les autorisations se cumulent, sauf refus qui est prioritaire. Le « plus restrictif » concerne la combinaison partage + NTFS.",s:"Cours · Caractéristiques NTFS"},
{t:"NTFS et partages",q:"Un utilisateur a « Modification » via un groupe et un « Refuser écriture » via un autre. Résultat ?",o:["Il ne peut pas écrire : le refus est prioritaire","Il peut écrire : les autorisations se cumulent","Il a le contrôle total","Il n'a plus aucun accès"],e:"Le refus ne retire que le privilège concerné.",s:"Cours · Caractéristiques NTFS"},
{t:"NTFS et partages",q:"À qui le cours recommande-t-il d'attribuer les autorisations NTFS ?",o:["À des groupes de sécurité plutôt qu'à des utilisateurs","Aux comptes utilisateurs individuellement","Au compte Invité","À Tout le monde"],e:"Et ne jamais donner plus de privilèges que nécessaire.",s:"Cours · Caractéristiques NTFS"},
{t:"NTFS et partages",q:"On déplace un dossier au sein de la même partition NTFS. Que deviennent ses autorisations ?",o:["Elles sont conservées","Il hérite du dossier de destination","Elles sont supprimées","Il reçoit le contrôle total pour Tout le monde"],e:"Copie dans la même partition, ou copie/déplacement vers une autre partition : le dossier hérite de la destination.",s:"Cours · Héritage des autorisations"},
{t:"NTFS et partages",q:"On déplace un dossier vers une autre partition. Que deviennent ses autorisations ?",o:["Il hérite des autorisations de la destination","Elles sont conservées","Elles sont supprimées","Il garde ses autorisations explicites uniquement"],e:"Un déplacement entre partitions est en réalité une copie suivie d'une suppression.",s:"Cours · Héritage des autorisations"},
{t:"NTFS et partages",q:"Quels sont les 3 niveaux d'autorisations de partage ?",o:["Lecture, Modification, Contrôle total","Lecture, Écriture, Exécution","Lire, Imprimer, Gérer","Parcourir, Lister, Supprimer"],e:"Comme en NTFS : règles cumulatives et refus prioritaire.",s:"Cours · Autorisations de partage"},
{t:"NTFS et partages",q:"Lors d'un accès réseau, quelles autorisations s'appliquent entre celles du partage et celles du NTFS ?",o:["Les plus restrictives des deux","Les plus permissives des deux","Uniquement celles du partage","Uniquement celles du NTFS"],e:"D'où le principe retenu en TP : partage large (contrôle total) et sécurité fine en NTFS, valable aussi en accès local.",s:"Cours · Autorisations résultantes / TP04"},
{t:"NTFS et partages",q:"Quelle cmdlet crée un nouveau partage SMB ?",o:["`New-SmbShare`","`Add-SmbShare`","`Set-SmbShare`","`New-Share`"],e:"`Get-SmbShare` liste, `Set-SmbShare` modifie, `Remove-SmbShare` supprime.",s:"Cours · Gérer les partages via PowerShell"},
{t:"NTFS et partages",q:"Pourquoi un refus explicite est-il indispensable pour les intérimaires sur Documentation ?",o:["Ils sont membres d'Utilisateurs du domaine, qui a la lecture","Sans refus, ils auraient le contrôle total","Un groupe global ne peut pas être absent d'une ACL","Le partage leur donne déjà l'écriture"],e:"Ne pas leur donner de droit ne suffit pas : ils hériteraient de la lecture. Un refus l'emporte toujours.",s:"TP04 · Gestion de ressources"},
{t:"NTFS et partages",q:"Quel est l'effet du `$` à la fin du nom de partage `Info$` ?",o:["Le partage est masqué dans le voisinage réseau mais reste accessible par son chemin","Le partage est réservé aux administrateurs","Le partage est chiffré","Le partage est en lecture seule"],e:"C'est une discrétion, pas une sécurité. La sécurité reste le NTFS.",s:"TP04 · Gestion de ressources"},
{t:"NTFS et partages",q:"Dans `icacls ... \"*S-1-3-0:(OI)(CI)(IO)F\"`, que signifie `(IO)` ?",o:["L'entrée s'applique aux sous-objets uniquement, pas au dossier lui-même","L'entrée est héritée par les fichiers uniquement","L'entrée est en lecture seule","L'héritage est supprimé"],e:"Inherit Only. Avec CREATEUR PROPRIETAIRE (S-1-3-0), celui qui crée un sous-dossier en obtient le contrôle total.",s:"TP05 · GPO (redirection)"},
{t:"NTFS et partages",q:"Dans `icacls`, que signifient `(OI)(CI)` ?",o:["Hérité par les fichiers (OI) et par les sous-dossiers (CI)","Propriétaire et contrôle intégral","Ouverture et création interdites","Objet isolé et conteneur isolé"],e:"Object Inherit et Container Inherit.",s:"TP04 · Gestion de ressources"},
{t:"NTFS et partages",q:"Que fait `icacls <dossier> /inheritance:r` ?",o:["Supprime l'héritage pour repartir d'une ACL maîtrisée","Réapplique l'héritage aux sous-dossiers","Réinitialise les propriétaires","Rend le dossier en lecture seule"],e:"On pose ensuite explicitement Administrateurs, SYSTEM et les groupes DL.",s:"TP04 · Gestion de ressources"},
{t:"NTFS et partages",q:"Tu testes plusieurs comptes depuis le même poste. Pourquoi lancer `net use * /delete /y` entre deux tests ?",o:["Windows n'autorise qu'une seule identité à la fois vers un même serveur","Pour vider le cache DNS","Pour forcer la réplication AD","Pour réinitialiser les ACL"],e:"Sans couper les sessions SMB, le test suivant rejoue avec l'identité précédente.",s:"TP04 · Gestion de ressources"},
{t:"NTFS et partages",q:"Un utilisateur vient d'être ajouté à un groupe mais n'a toujours pas accès. Pourquoi ?",o:["Son jeton d'accès, créé à l'ouverture de session, ne contient pas le nouveau groupe","La réplication AD prend 24 h","Il faut redémarrer le serveur de fichiers","Il faut lancer `gpupdate /force` sur le serveur"],e:"Fermer puis rouvrir la session.",s:"TP04 · Gestion de ressources"},
{t:"NTFS et partages",q:"Un disque virtuel en miroir est créé dans un pool de 3 disques. Quelle affirmation est vraie ?",o:["Chaque bloc est écrit sur deux disques : efficacité de 50 %","Les données sont réparties sans redondance","Il faut au moins 4 disques pour un miroir","La perte d'un disque rend le volume inaccessible"],e:"34,5 Go consommés pour 16 Go utiles, mais la perte d'un disque n'interrompt pas le service.",s:"TP04 · Pool de stockage"},

{t:"AGDLP",q:"Dans la méthode AGDLP, à quel type d'objet attribue-t-on les permissions ?",o:["Aux groupes de domaine local","Aux groupes globaux","Directement aux comptes utilisateurs","Aux groupes universels"],e:"A → G → DL → P : comptes dans des groupes globaux (par fonction), eux-mêmes dans des DL (par ressource et niveau de droit).",s:"Cours · Imbrication des groupes / TP04"},

{t:"GPO – fonctionnement",q:"Quelle ruche du registre contient la configuration de l'utilisateur connecté ?",o:["`HKEY_CURRENT_USER`","`HKEY_LOCAL_MACHINE`","`HKEY_USERS`","`HKEY_CLASSES_ROOT`"],e:"HKLM = configuration de l'ordinateur. HKU = tous les profils chargés. HKCR = applications et extensions.",s:"Cours · Structure du registre"},
{t:"GPO – fonctionnement",q:"En cas de conflit, qui l'emporte entre une stratégie de groupe et une stratégie locale ?",o:["La stratégie de groupe","La stratégie locale","La plus récente","Aucune, le paramètre est ignoré"],e:"La stratégie locale est la première appliquée (L de LSDOU), donc la plus facilement écrasée.",s:"Cours · Stratégie de groupe vs locale"},

{t:"GPO – fonctionnement",q:"À quelle fréquence les GPO sont-elles réappliquées en arrière-plan sur un poste membre ?",o:["Toutes les 90 minutes, à ±30 minutes près","Toutes les 5 minutes","Une fois par jour","Uniquement au démarrage"],e:"Sur les contrôleurs de domaine : toutes les 5 minutes. Forcer : `gpupdate`.",s:"Cours · Intervalles d'actualisation"},

{t:"GPO – fonctionnement",q:"Comment prendre en compte un paramètre de configuration ordinateur sur un poste de test ?",o:["`gpupdate /force` puis redémarrage","`gpupdate /force` puis fermeture de session","`gpresult /r`","Rien, c'est immédiat"],e:"Utilisateur : fermeture et réouverture de session. Redirection et imprimantes : ouverture de session uniquement.",s:"TP05 · GPO"},

{t:"GPO – ciblage",q:"Une GPO ne contenant que des paramètres utilisateur est liée à une OU ne contenant que des ordinateurs. Résultat ?",o:["Aucun effet","Les paramètres s'appliquent aux utilisateurs qui se connectent sur ces postes","Ils s'appliquent au prochain redémarrage","La GPO est refusée par le DC"],e:"Sauf traitement par bouclage (loopback). C'est le premier point à vérifier quand un paramètre semble ignoré.",s:"Cours · Ciblage / TP05"},
{t:"GPO – ciblage",q:"Dans quel ordre les GPO sont-elles appliquées ?",o:["Local → Site → Domaine → OU parente → OU enfant","Domaine → Site → OU → Local","OU enfant → OU parente → Domaine → Site","Site → Local → Domaine → OU"],e:"LSDOU : la dernière appliquée, la plus proche de l'objet, l'emporte.",s:"Cours · Valeurs conflictuelles"},

{t:"GPO – ciblage",q:"Que fait le blocage d'héritage sur une OU ?",o:["Il annule la prise en compte de toutes les GPO héritées des conteneurs parents","Il bloque une seule GPO choisie","Il empêche les enfants d'hériter des GPO de l'OU","Il bloque les GPO locales"],e:"Il agit sur toutes les stratégies héritées, pas sur une en particulier.",s:"Cours · Héritage et restriction"},

{t:"GPO – ciblage",q:"Quel mécanisme limite l'application d'une GPO selon des critères du poste (OS, RAM…) ?",o:["Le filtre WMI","Le filtrage de sécurité","Le blocage d'héritage","Le lien Appliqué"],e:"Le filtrage de sécurité, lui, autorise ou refuse via des ACE sur des utilisateurs, ordinateurs ou groupes.",s:"Cours · Héritage et restriction"},
{t:"GPO – ciblage",q:"Une GPO n'a aucun effet. Quelle est la première chose à déterminer ?",o:["Si la GPO a été appliquée ou non","Si le DC est en Server Core","Si le poste a été redémarré dans la semaine","Si l'utilisateur est administrateur"],e:"Appliquée mais sans effet : paramètre non supporté par l'OS ou conflit. Non appliquée : problème de liaison ou de filtrage.",s:"Cours · Dysfonctionnements et diagnostics"},
{t:"GPO – ciblage",q:"Quelle commande, sur le poste, montre les GPO appliquées et filtrées ?",o:["`gpresult /r`","`gpupdate /force`","`gpedit.msc`","`rsop /apply`"],e:"`gpresult /h rapport.html` pour un rapport détaillé. Côté console : l'assistant Résultats de stratégie de groupe.",s:"Cours · Diagnostics / TP05"},

];

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const THEMES = [...new Set(QUESTIONS.map(q => q.t))];
let count = 20;
let run = null;

function show(id){ ['start','quiz','result'].forEach(s => $('#'+s).hidden = s !== id); window.scrollTo(0,0); }

/* Accueil */
function renderStart(){
  $('#introTxt').textContent = `${QUESTIONS.length} questions tirées du cours et des TP. Questions et réponses sont mélangées à chaque partie.`;
  $('#themes').innerHTML = THEMES.map(t => {
    const n = QUESTIONS.filter(q => q.t === t).length;
    return `<label class="chip"><input type="checkbox" value="${esc(t)}" checked><span>${esc(t)} (${n})</span></label>`;
  }).join('');
  $('#themes').querySelectorAll('input').forEach(i => i.addEventListener('change', updateAvail));
  updateAvail();
  const best = store.get(STORE_KEY);
  $('#best').textContent = best ? `Meilleur score : ${best.s}/${best.n}` : '';
}
const selectedThemes = () => [...$('#themes').querySelectorAll('input:checked')].map(i => i.value);
function updateAvail(){
  const th = selectedThemes();
  const n = QUESTIONS.filter(q => th.includes(q.t)).length;
  $('#avail').textContent = `${n} disponibles`;
  $('#counts').innerHTML = [10, 20, 40, 'all'].map(o => {
    const lab = o === 'all' ? `Toutes (${n})` : o;
    const dis = o !== 'all' && o >= n;
    return `<label class="chip"><input type="radio" name="count" value="${o}" ${String(o) === String(count) ? 'checked' : ''} ${dis ? 'disabled' : ''}><span>${lab}</span></label>`;
  }).join('');
  if (!$('#counts input:checked:not(:disabled)')) { $('#counts input[value="all"]').checked = true; count = 'all'; }
  $('#counts').querySelectorAll('input').forEach(i => i.addEventListener('change', () => count = i.value === 'all' ? 'all' : +i.value));
  $('#go').disabled = n === 0;
  $('#toggleAll').textContent = th.length ? 'Tout décocher' : 'Tout cocher';
}

/* Quiz */
function start(pool, retry){
  let items = shuffle(pool);
  if (!retry && count !== 'all') items = items.slice(0, count);
  run = { retry, items: items.map(q => ({ q, opts: shuffle(q.o.map((txt, k) => ({ txt, ok: k === 0 }))) })), i: 0, answers: [] };
  $('#qtot').textContent = run.items.length;
  const tr = $('#track');
  tr.classList.toggle('dense', run.items.length > 40);
  tr.innerHTML = run.items.map(() => '<i></i>').join('');
  show('quiz');
  renderQ();
}
function paintTrack(el, cur){
  [...el.children].forEach((seg, k) => {
    const a = run.answers[k];
    seg.className = a === undefined ? (k === cur ? 'cur' : '') : (a.ok ? 'ok' : 'ko');
  });
}
function renderQ(){
  const it = run.items[run.i];
  $('#qnum').textContent = run.i + 1;
  $('#qtheme').textContent = it.q.t;
  $('#qtext').innerHTML = fmt(it.q.q);
  $('#opts').innerHTML = it.opts.map((o, k) =>
    `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${fmt(o.txt)}</span></button>`).join('');
  $('#opts').querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(+b.dataset.k)));
  $('#fb').hidden = true;
  $('#nextBtn').hidden = true;
  paintTrack($('#track'), run.i);
  $('#opts .opt').focus({ preventScroll: true });
}
function answer(k){
  if (run.answers[run.i] !== undefined) return;
  const it = run.items[run.i];
  const ok = it.opts[k].ok;
  run.answers[run.i] = { ok, picked: it.opts[k].txt };
  $('#opts').querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    b.classList.add(it.opts[j].ok ? 'right' : j === k ? 'wrong' : 'dim');
  });
  const fb = $('#fb');
  fb.className = 'feedback ' + (ok ? 'ok' : 'ko');
  fb.innerHTML = `<div class="verdict">${ok ? 'Bonne réponse' : 'Raté'}</div><div>${fmt(it.q.e)}</div><div class="src">${esc(it.q.s)}</div>`;
  fb.hidden = false;
  paintTrack($('#track'), -1);
  const nb = $('#nextBtn');
  nb.textContent = run.i === run.items.length - 1 ? 'Voir le résultat' : 'Question suivante';
  nb.hidden = false;
  nb.focus({ preventScroll: true });
  fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function next(){ if (run.i < run.items.length - 1) { run.i++; renderQ(); } else renderResult(); }

/* Résultats */
function renderResult(){
  const n = run.items.length, s = run.answers.filter(a => a && a.ok).length;
  $('#rscore').textContent = `${s} / ${n}`;
  $('#rpct').textContent = `${Math.round(s / n * 100)} %`;
  const rt = $('#rtrack');
  rt.classList.toggle('dense', n > 40);
  rt.innerHTML = run.items.map(() => '<i></i>').join('');
  paintTrack(rt, -1);

  const by = {};
  run.items.forEach((it, k) => { const t = it.q.t; by[t] = by[t] || { s: 0, n: 0 }; by[t].n++; if (run.answers[k]?.ok) by[t].s++; });
  $('#rows').innerHTML = Object.entries(by).sort((a, b) => a[1].s / a[1].n - b[1].s / b[1].n).map(([t, v]) =>
    `<div class="row"><span>${esc(t)}</span><span class="bar"><i style="width:${v.s / v.n * 100}%"></i></span><span class="n">${v.s}/${v.n}</span></div>`).join('');

  const missed = run.items.map((it, k) => ({ it, a: run.answers[k] })).filter(x => !x.a?.ok);
  $('#retryMiss').hidden = missed.length === 0;
  $('#misses').innerHTML = missed.length ? '<h2>À revoir</h2>' + missed.map(({ it, a }) =>
    `<div class="miss"><p><b>${fmt(it.q.q)}</b></p><p class="y">Ta réponse : ${fmt(a.picked)}</p><p class="a">Bonne réponse : ${fmt(it.q.o[0])}</p><p class="muted">${fmt(it.q.e)}</p></div>`
  ).join('') : '<p>Aucune erreur. Bien joué.</p>';

  if (!run.retry) {
    const best = store.get(STORE_KEY);
    if (n >= 10 && (!best || s / n > best.s / best.n)) store.set(STORE_KEY, { s, n });
  }
  run.missed = missed.map(x => x.it.q);
  show('result');
}

/* Événements */
$('#toggleAll').addEventListener('click', () => {
  const inputs = $('#themes').querySelectorAll('input'); const anyOn = [...inputs].some(i => i.checked);
  inputs.forEach(i => i.checked = !anyOn); updateAvail();
});
$('#go').addEventListener('click', () => { const th = selectedThemes(); start(QUESTIONS.filter(q => th.includes(q.t)), false); });
$('#nextBtn').addEventListener('click', next);
$('#quit').addEventListener('click', () => { renderStart(); show('start'); });
$('#again').addEventListener('click', () => { renderStart(); show('start'); });
$('#retryMiss').addEventListener('click', () => start(run.missed, true));
document.addEventListener('keydown', e => {
  if ($('#quiz').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = { '1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3 }[e.key.toLowerCase()];
  if (k !== undefined && run.answers[run.i] === undefined && k < run.items[run.i].opts.length) { e.preventDefault(); answer(k); }
  else if (e.key === 'Enter' && !$('#nextBtn').hidden && document.activeElement !== $('#nextBtn')) { e.preventDefault(); next(); }
});

renderStart();
</script>
